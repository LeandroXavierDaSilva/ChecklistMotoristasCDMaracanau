<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portal do Motorista</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="logo-area">
                <h1>Portal do Motorista</h1>
                <p>Controle de Entrada - Suzano Maracanaú</p>
            </div>

            <div class="progress-area">

                <div class="progress-step active">
                    <span>1</span>
                    <small>Motorista</small>
                </div>

                <div class="progress-line"></div>

                <div class="progress-step">
                    <span>2</span>
                    <small>Caminhão</small>
                </div>

                <div class="progress-line"></div>

                <div class="progress-step">
                    <span>3</span>
                    <small>Checklist</small>
                </div>

                <div class="progress-line"></div>

                <div class="progress-step">
                    <span>4</span>
                    <small>Confirmação</small>
                </div>

            </div>

            <form id="cadastroForm">

                <h2>Dados do Motorista</h2>

                <div class="form-group">

                    <label for="nome">
                        Nome completo *
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="celular">
                        Celular *
                    </label>

                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="cpf">
                        CPF *
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        maxlength="14"
                        placeholder="000.000.000-00"
                        required
                    >

                    <small
                        id="cpfError"
                        class="field-error"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="cnh">
                        CNH *
                    </label>

                    <input
                        type="text"
                        id="cnh"
                        name="cnh"
                        maxlength="9"
                        placeholder="Digite sua CNH"
                        required
                    >

                </div>

                <div class="form-group">

    <label for="validadeCnh">
        Validade CNH *
    </label>

                    <input
                        type="text"
                        id="validadeCnh"
                        name="validadeCnh"
                        placeholder="dd/mm/aaaa"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="off"
                        required
                    >

                    <small
                        id="validadeCnhError"
                        class="field-error"
                    ></small>

                </div>

                <h2>Itens obrigatórios</h2>

                <div class="question-group">

                    <label>
                        Calçado de Segurança? *
                    </label>

                    <div class="choice-buttons">

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="calcado"
                                value="Sim"
                                required
                            >
                            <span>SIM</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="calcado"
                                value="Não"
                            >
                            <span>NÃO</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="calcado"
                                value="N/A"
                            >
                            <span>N/A</span>
                        </label>

                    </div>

                </div>

                <div class="question-group">

                    <label>
                        Trajes (calça comprida e camisa)? *
                    </label>

                    <div class="choice-buttons">

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="trajes"
                                value="Sim"
                                required
                            >
                            <span>SIM</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="trajes"
                                value="Não"
                            >
                            <span>NÃO</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="trajes"
                                value="N/A"
                            >
                            <span>N/A</span>
                        </label>

                    </div>

                </div>

                <div class="question-group">

                    <label>
                        Colete Refletivo? *
                    </label>

                    <div class="choice-buttons">

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="colete"
                                value="Sim"
                                required
                            >
                            <span>SIM</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="colete"
                                value="Não"
                            >
                            <span>NÃO</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="colete"
                                value="N/A"
                            >
                            <span>N/A</span>
                        </label>

                    </div>

                </div>

                <div class="question-group">

                    <label>
                        App Comprovei? *
                    </label>

                    <div class="choice-buttons">

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="comprovei"
                                value="Sim"
                                required
                            >
                            <span>SIM</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="comprovei"
                                value="Não"
                            >
                            <span>NÃO</span>
                        </label>

                        <label class="choice-button">
                            <input
                                type="radio"
                                name="comprovei"
                                value="N/A"
                            >
                            <span>N/A</span>
                        </label>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Avançar
                </button>

            </form>

        </section>

    </main>

    <script src="cadastro.js"></script>

</body>

</html>
